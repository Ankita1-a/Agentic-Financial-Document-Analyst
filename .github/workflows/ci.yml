name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r frontend/requirements.txt
          # Neither deployed service touches ingestion, so pymupdf4llm isn't
          # in either requirements.txt — but this job also tests ingest/,
          # which needs it. google-genai: only needed for agent/tools.py's
          # own signature regression guard, not a runtime dependency of the
          # app itself — see requirements.txt's comment on this.
          pip install pymupdf4llm google-genai

      # No live MISTRAL_API_KEY in CI — every one of these is an offline
      # smoke test (mocked LLM calls, fake embedding functions), verifying
      # real logic and real exception classes, not live network behavior.
      # See each file's own docstring for what it actually covers.
      - name: Run smoke tests
        run: |
          python stores/financials_db.py
          python stores/vectorstore.py
          python agent/verifier.py
          python agent/tools.py
          python agent/orchestrator_langgraph.py
          python ingest/extract.py
          python ingest/build_index.py

      - name: Compile-check the apps
        run: |
          python -m py_compile backend/main.py frontend/app.py

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image repository name
        # Docker/OCI repository names must be all-lowercase — a hard rule
        # of the image spec, not a GitHub quirk. github.repository
        # preserves the exact case of the repo/owner as created on GitHub,
        # so a repo or username with any uppercase letters (like this one)
        # makes `ghcr.io/${{ github.repository }}/...` an invalid tag
        # outright. GitHub Actions' expression syntax has no built-in
        # lower() function, so this computes it via the shell instead and
        # stores it in GITHUB_ENV for the build steps below to reference.
        run: echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.IMAGE_REPO }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.IMAGE_REPO }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max